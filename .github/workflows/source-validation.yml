name: Source validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile source/build.py source/verify.py source/source_sanity_check.py
      - name: Static source invariants
        run: python source/source_sanity_check.py
      - name: No proprietary game DLLs committed
        run: |
          if git ls-files | grep -E '(^|/)(Assembly-CSharp\.dll|Solasta_Data/|Managed/)'; then
            echo 'Proprietary game assets must not be committed.'
            exit 1
          fi
