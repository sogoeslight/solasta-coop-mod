name: Mark release as Latest

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to mark as Latest"
        required: true
        default: "v0.1.19"
        type: string
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  promote-release:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[promote-v0.1.19]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Promote GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'v0.1.19' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease=false \
            --latest
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,isLatest
