name: Windows build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release tag (e.g. v0.1.18). Blank means build artifact only."
        type: string
        required: false
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows x64 loader
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Run source sanity checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile source/build.py source/verify.py source/source_sanity_check.py source/nexus_release_context.py source/publish_nexus_description.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed' }
          python source/source_sanity_check.py
          if ($LASTEXITCODE -ne 0) { throw 'Source sanity check failed' }

      - name: Load private build references
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOLASTA_REFS_TOKEN: ${{ secrets.SOLASTA_REFS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $temp = Join-Path $env:RUNNER_TEMP 'solasta-ci-refs'
          $archive = Join-Path $temp 'SolastaManagedRefs.zip'
          $unpack = Join-Path $temp 'managed'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null

          if ([string]::IsNullOrWhiteSpace($env:SOLASTA_REFS_TOKEN)) {
            throw 'Missing SOLASTA_REFS_TOKEN. Configure the read-only token for the private solasta-build-refs repository.'
          }
          $env:GH_TOKEN = $env:SOLASTA_REFS_TOKEN
          $sourceRepository = 'sogoeslight/solasta-build-refs'
          gh release download ci-build-refs --repo $sourceRepository --pattern 'SolastaManagedRefs.zip' --dir $temp
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $archive)) {
            throw "Missing private reference archive in $sourceRepository. See docs/CI_RELEASES.md"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $unpack -Force
          $assembly = Get-ChildItem -LiteralPath $unpack -Filter Assembly-CSharp.dll -Recurse -File | Select-Object -First 1
          if (-not $assembly) { throw 'Assembly-CSharp.dll was not found inside reference ZIP' }
          $managed = Split-Path -Parent $assembly.FullName
          $names = @(
            'mscorlib', 'System', 'System.Core', 'UnityEngine',
            'UnityEngine.CoreModule', 'UnityEngine.IMGUIModule',
            'UnityEngine.InputLegacyModule', 'UnityEngine.TextRenderingModule',
            'UnityEngine.ScreenCaptureModule', 'UnityEngine.ImageConversionModule',
            'UnityEngine.AnimationModule', 'UnityEngine.ParticleSystemModule',
            'UnityEngine.UI', 'UnityEngine.UIModule'
          )
          foreach ($name in $names) {
            if (-not (Test-Path (Join-Path $managed "$name.dll"))) {
              throw "Missing game reference: $name.dll"
            }
          }
          "SOLASTA_MANAGED=$managed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'Managed references validated and ready for this run.'

      - name: Compile managed payload and native loader
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $gcc = Join-Path $env:MSYS2_LOCATION 'mingw64\bin\gcc.exe'
          if (-not (Test-Path $gcc)) { throw "Cannot find gcc.exe: $gcc" }

          $sdkLine = dotnet --list-sdks | Where-Object { $_ -match '^8\.\d+\.\d+ ' } | Select-Object -Last 1
          if (-not $sdkLine) { throw 'Cannot find .NET SDK 8' }
          $sdkVersion = ($sdkLine -split '\s+')[0]
          $dotnet = (Get-Command dotnet -ErrorAction Stop).Source
          $csc = Join-Path (Split-Path -Parent $dotnet) "sdk\$sdkVersion\Roslyn\bincore\csc.dll"
          if (-not (Test-Path $csc)) { throw "Cannot find compiler: $csc" }

          python source/build.py --managed "$env:SOLASTA_MANAGED" --dotnet "$dotnet" --csc "$csc" --cc "$gcc"
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }

          $dll = Join-Path $env:GITHUB_WORKSPACE 'build\winhttp.dll'
          if (-not (Test-Path $dll)) { throw 'winhttp.dll was not created' }
          if ((Get-Item $dll).Length -lt 10240) { throw 'winhttp.dll is unexpectedly small' }
          Write-Host "Compiled: $dll"

      - name: Upload winhttp.dll artifact
        uses: actions/upload-artifact@v4
        with:
          name: solasta-coop-mod-windows-x64
          path: build/winhttp.dll
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' || contains(github.event.head_commit.message, '[release v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:RELEASE_VERSION)) {
            $env:RELEASE_VERSION
          } else {
            if ($env:COMMIT_MESSAGE -notmatch '\[release (v\d+\.\d+\.\d+(?:[.-][A-Za-z0-9.-]+)?)\]') { throw 'Release marker is missing' }
            $Matches[1]
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+([.-][A-Za-z0-9.-]+)?$') {
            throw 'Release version should be v0.1.20 or v0.1.21-beta.1'
          }
          # gh release create exits with an error if the release already exists.
          # Never overwrite a published release's binaries.
          $notesFile = "docs/RELEASE_$tag.md"
          $releaseNotes = if (Test-Path $notesFile) {
            @('--notes-file', $notesFile)
          } else {
            @('--generate-notes')
          }
          gh release create $tag "build/winhttp.dll" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Solasta Coop Mod $tag" @releaseNotes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
