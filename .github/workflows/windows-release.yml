name: Windows build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release tag (e.g. v0.1.18). Blank means build artifact only."
        type: string
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows x64 loader
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Run source sanity checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile source/build.py source/verify.py source/source_sanity_check.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed' }
          python source/source_sanity_check.py
          if ($LASTEXITCODE -ne 0) { throw 'Source sanity check failed' }

      - name: Load private build references
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $temp = Join-Path $env:RUNNER_TEMP 'solasta-ci-refs'
          $archive = Join-Path $temp 'SolastaManagedRefs.zip'
          $unpack = Join-Path $temp 'managed'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null

          gh release download ci-build-refs --repo $env:GITHUB_REPOSITORY --pattern 'SolastaManagedRefs.zip' --dir $temp
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $archive)) {
            throw 'Missing private reference archive. See docs/CI_RELEASES.md'
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $unpack -Force
          $assembly = Get-ChildItem -LiteralPath $unpack -Filter Assembly-CSharp.dll -Recurse -File | Select-Object -First 1
          if (-not $assembly) { throw 'Assembly-CSharp.dll was not found inside reference ZIP' }
          $managed = Split-Path -Parent $assembly.FullName
          $names = @(
            'mscorlib', 'System', 'System.Core', 'UnityEngine',
            'UnityEngine.CoreModule', 'UnityEngine.IMGUIModule',
            'UnityEngine.InputLegacyModule', 'UnityEngine.TextRenderingModule',
            'UnityEngine.ScreenCaptureModule', 'UnityEngine.ImageConversionModule',
            'UnityEngine.AnimationModule', 'UnityEngine.ParticleSystemModule',
            'UnityEngine.UI', 'UnityEngine.UIModule'
          )
          foreach ($name in $names) {
            if (-not (Test-Path (Join-Path $managed "$name.dll"))) {
              throw "Missing game reference: $name.dll"
            }
          }
          "SOLASTA_MANAGED=$managed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'Managed references validated and ready for this run.'

      - name: Compile managed payload and native loader
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $gcc = Join-Path $env:MSYS2_LOCATION 'mingw64\bin\gcc.exe'
          if (-not (Test-Path $gcc)) { throw "Cannot find gcc.exe: $gcc" }

          $sdkLine = dotnet --list-sdks | Where-Object { $_ -match '^8\.\d+\.\d+ ' } | Select-Object -Last 1
          if (-not $sdkLine) { throw 'Cannot find .NET SDK 8' }
          $sdkVersion = ($sdkLine -split '\s+')[0]
          $dotnet = (Get-Command dotnet -ErrorAction Stop).Source
          $csc = Join-Path (Split-Path -Parent $dotnet) "sdk\$sdkVersion\Roslyn\bincore\csc.dll"
          if (-not (Test-Path $csc)) { throw "Cannot find compiler: $csc" }

          python source/build.py --managed "$env:SOLASTA_MANAGED" --dotnet "$dotnet" --csc "$csc" --cc "$gcc"
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }

          $dll = Join-Path $env:GITHUB_WORKSPACE 'build\winhttp.dll'
          if (-not (Test-Path $dll)) { throw 'winhttp.dll was not created' }
          if ((Get-Item $dll).Length -lt 10240) { throw 'winhttp.dll is unexpectedly small' }
          Write-Host "Compiled: $dll"

      - name: Package release artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item 'build\winhttp.dll' 'dist\winhttp.dll'
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:RELEASE_VERSION)) {
            $env:RELEASE_VERSION
          } else {
            'dev-' + $env:GITHUB_SHA.Substring(0, 8)
          }
          if ($version -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') {
            throw "Invalid version: $version"
          }
          $zip = "dist\solasta-coop-mod-$version-win-x64.zip"
          Compress-Archive -Path 'build\winhttp.dll' -DestinationPath $zip -Force
          $hashes = @('winhttp.dll', (Split-Path -Leaf $zip)) | ForEach-Object {
            $hash = (Get-FileHash -Path (Join-Path 'dist' $_) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $_"
          }
          $hashes | Set-Content 'dist\SHA256SUMS.txt'

      - name: Save downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: solasta-coop-mod-windows-x64
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:RELEASE_VERSION }
          if ($tag -notmatch '^v\d+\.\d+\.\d+([.-][A-Za-z0-9.-]+)?$') {
            throw 'Release version should be v0.1.18 or v0.1.19-beta.1'
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; refusing to overwrite."
          }
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $tag --generate-notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
