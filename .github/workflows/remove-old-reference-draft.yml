name: Remove obsolete private reference draft

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-old-reference-draft.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify new private storage, then remove old private draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_REFS_TOKEN: ${{ secrets.SOLASTA_REFS_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$PRIVATE_REFS_TOKEN" ]]; then
            echo "::error::Missing SOLASTA_REFS_TOKEN. Refusing to delete old reference draft."
            exit 1
          fi

          echo "Checking read access to new private reference archive..."
          asset_found=$(GH_TOKEN="$PRIVATE_REFS_TOKEN" gh release view ci-build-refs \
            --repo sogoeslight/solasta-build-refs \
            --json assets --jq '[.assets[].name] | index("SolastaManagedRefs.zip") != null')
          if [[ "$asset_found" != "true" ]]; then
            echo "::error::Private build references missing. Old draft preserved."
            exit 1
          fi

          if gh release view ci-build-refs --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx true; then
            echo "Removing obsolete draft and tag from main repository..."
            gh release delete ci-build-refs --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            echo "No obsolete draft release exists in main repository."
          fi
          echo "Old reference draft cleanup complete."
